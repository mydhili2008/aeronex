<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SkyJourney</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script><script src="js/booking.js" defer></script></head><body><header class="site-header" data-site-header></header><main class="container"><section class="page-intro page-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to SkyJourney</h1><p>Demo account interface. Authentication is not connected.</p></section><section class="card" style="max-width:560px;margin:20px auto"><form id="login-form" class="stack"><div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" minlength="8"></div><button class="btn btn-primary" type="submit">Continue</button><p id="login-message" role="status"></p></form><p class="muted">For production, implement secure server-side authentication, password hashing, and account recovery.</p></section></main><footer class="site-footer" data-site-footer></footer></body></html>
