<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger details | SkyJourney</title><link rel="stylesheet" href="css/style.css"><script src="js/storage.js" defer></script><script src="js/main.js" defer></script><script src="js/booking.js" defer></script></head><body><header class="site-header" data-site-header></header><main class="container"><section class="page-intro page-heading"><span class="eyebrow">STEP 1 OF 3</span><h1>Passenger information</h1><p>Enter sample traveller details. Use test data only.</p><div class="steps"><span class="step active">1 · Passengers</span><span class="step">2 · Seats</span><span class="step">3 · Review</span></div></section><section class="form-card card"><form id="passenger-form" class="form-grid"><div class="field"><label for="firstName">First name</label><input name="firstName" id="firstName" autocomplete="given-name" required></div><div class="field"><label for="lastName">Last name</label><input name="lastName" id="lastName" autocomplete="family-name" required></div><div class="field"><label for="email">Email</label><input type="email" name="email" id="email" autocomplete="email" required></div><div class="field"><label for="phone">Phone</label><input type="tel" name="phone" id="phone" autocomplete="tel" required></div><div class="field"><label for="dob">Date of birth</label><input type="date" name="dob" id="dob" required></div><div class="field"><label for="title">Title</label><select name="title" id="title"><option>Mr</option><option>Ms</option><option>Mx</option><option>Mrs</option></select></div><div class="full notice">Demo only: personal data stays in this browser's local storage. Avoid entering sensitive real information.</div><div class="full"><button class="btn btn-primary" type="submit">Continue to seats →</button></div></form></section></main><footer class="site-footer" data-site-footer></footer></body></html>
