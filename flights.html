<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight results | SkyJourney</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script><script src="js/flights.js" defer></script></head><body><header class="site-header" data-site-header></header><main class="container"><section class="page-intro page-heading"><span class="eyebrow">YOUR OPTIONS</span><h1 id="route-title">Vijayawada → New Delhi</h1><p id="route-subtitle">Compare demo schedules and sample fares.</p><a class="btn btn-outline" href="index.html#search">← Edit search</a></section><div class="two-col section"><aside class="panel filters"><div class="filter-group"><h3>Maximum fare</h3><input id="max-price" type="range" min="3000" max="10000" step="250" value="10000"><span id="price-value">₹10,000</span></div><div class="filter-group"><h3>Stops</h3><label class="check-row"><input id="nonstop" type="checkbox"> Non-stop only</label></div><div class="filter-group"><h3>Sort by</h3><select id="sort"><option value="recommended">Recommended</option><option value="cheapest">Cheapest first</option><option value="fastest">Fastest first</option><option value="earliest">Earliest departure</option></select></div><p class="muted">All displayed schedules and prices are illustrative demo data.</p></aside><section><div class="results-toolbar"><strong>Available sample flights</strong><span class="pill">Demo inventory</span></div><div id="flight-list" class="flight-list"></div></section></div></main><footer class="site-footer" data-site-footer></footer></body></html>
